server.port=8080

# Spring Application Name
spring.application.name=civicguard-backend

# H2 Database Configuration (file-based persistence in ./data/civicguarddb)
spring.datasource.url=jdbc:h2:file:./data/civicguarddb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# JPA / Hibernate Properties
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# H2 Console (enabled for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Multipart / File Upload Configuration (2MB limit as required)
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=5MB

# Upload Directory Path
app.upload.dir=./uploads

# Logging
logging.level.org.springframework.security=INFO
logging.level.com.civicshield=DEBUG
